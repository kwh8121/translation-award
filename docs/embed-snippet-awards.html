<!--
  Award Ceremony iframe — imweb.me 페이지의 HTML 위젯에 붙여넣을 코드.
  Literary News 스니펫과 같은 페이지에 함께 붙여넣어도 충돌 없음
  (iframe id 와 postMessage type 모두 분리되어 있음).
-->
<iframe
  id="award-ceremony-frame"
  src="https://translation-award.vercel.app/embed/awards"
  style="width: 100%; border: 0; display: block; min-height: 600px"
  scrolling="no"
  loading="lazy"
  referrerpolicy="no-referrer-when-downgrade"
  title="Award Ceremony"
></iframe>
<script>
  ;(function () {
    var frame = document.getElementById('award-ceremony-frame')
    if (!frame) return
    var allowedOrigin = new URL(frame.src).origin
    window.addEventListener('message', function (e) {
      if (e.origin !== allowedOrigin) return
      if (!e.data || e.data.type !== 'award-ceremony:height') return
      var h = parseInt(e.data.height, 10)
      if (!isNaN(h) && h > 0) {
        frame.style.height = h + 'px'
      }
    })
  })()
</script>
