<!--
  imweb.me 페이지의 HTML 위젯에 붙여넣을 코드.
  src의 도메인을 실제 Vercel 배포 도메인으로 교체하세요.
-->
<iframe
  id="literary-news-frame"
  src="https://translation-award.vercel.app/embed"
  style="width: 100%; border: 0; display: block; min-height: 600px"
  scrolling="no"
  loading="lazy"
  referrerpolicy="no-referrer-when-downgrade"
  title="Literary News"
></iframe>
<script>
  ;(function () {
    var frame = document.getElementById('literary-news-frame')
    if (!frame) return
    var allowedOrigin = new URL(frame.src).origin
    window.addEventListener('message', function (e) {
      if (e.origin !== allowedOrigin) return
      if (!e.data || e.data.type !== 'literary-news:height') return
      var h = parseInt(e.data.height, 10)
      if (!isNaN(h) && h > 0) {
        frame.style.height = h + 'px'
      }
    })
  })()
</script>
